services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrilens-api:local
    env_file:
      - .env
    environment:
      AGRILENS_MODEL_PATH: /models/agrilens_model.tflite
      AGRILENS_ARTIFACTS_DIR: /models/artifacts
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "${AGRILENS_API_PORT:-8888}:8888"
    volumes:
      - ./app:/app/app
      - ../agrilens/assets/models/agrilens_model.tflite:/models/agrilens_model.tflite:ro
      - ../agrilens-training/artifacts:/models/artifacts:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8888", "--reload", "--reload-dir", "/app"]
    restart: unless-stopped

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrilens-api:local
    env_file:
      - .env
    environment:
      AGRILENS_MODEL_PATH: /models/agrilens_model.tflite
      AGRILENS_ARTIFACTS_DIR: /models/artifacts
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      REDIS_URL: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${AGRILENS_API_PORT:-8888}:8888"
    volumes:
      - ./app:/app/app
      - ./models/agrilens_model.tflite:/models/agrilens_model.tflite:ro
      - ./artifacts:/models/artifacts:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8888", "--reload", "--reload-dir", "/app"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  health-pinger:
    image: curlimages/curl:8.12.1
    command:
      - sh
      - -c
      - |
        while true; do
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          curl --fail --silent --show-error --output /dev/null --write-out 'Health ping: HTTP %{http_code}\n' https://agrilens-es4o.onrender.com/health || echo 'Health ping failed'
          sleep 300
        done
    restart: unless-stopped
